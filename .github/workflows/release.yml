name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("custom_components/harmony_ir/manifest.json").read_text())
          expected_tag = f"v{manifest['version']}"
          if os.environ["RELEASE_TAG"] != expected_tag:
              raise SystemExit(f"Release tag must match manifest version: {expected_tag}")
          PY
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "Harmony Infrared $RELEASE_TAG"
